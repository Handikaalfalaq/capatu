spring.application.name=reminder-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5434/capatu_reminder
spring.datasource.username=capatu
spring.datasource.password=capatu

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

shoe-service.base-url=http://localhost:8081
shoe-service.connect-timeout-ms=3000
shoe-service.read-timeout-ms=5000

capatu.reminder.wash-threshold=5
capatu.reminder.replace-warning-ratio=0.9
capatu.reminder.rotation-days=30
capatu.reminder.scheduler-enabled=true
capatu.reminder.evaluation-initial-delay-ms=60000
capatu.reminder.evaluation-interval-ms=300000
